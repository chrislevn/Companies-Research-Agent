global:
  scrape_interval: 10s        # a demo wants to see the bar move, not wait a minute
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: companies-research-agent
    static_configs:
      # The agent runs on the host, not in a container: it needs mailbox
      # credentials and possibly a local Ollama.
      - targets: ["host.docker.internal:9464"]
        labels:
          service: companies-research-agent
      # The eval lane: CLI runs (eval, compare, redteam, report-quality)
      # started with METRICS_PORT=9465 report here, so experiments land on
      # the same dashboards without fighting the long-running app for 9464.
      - targets: ["host.docker.internal:9465"]
        labels:
          service: companies-research-eval
